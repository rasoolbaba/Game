name: Deploy game to GitHub Pages

# Publishes the self-contained playable prototypes in site/ to GitHub Pages.
# Pages must be set in repo Settings -> Pages -> Source: GitHub Actions.
# Keep this workflow as the single Pages deploy path.
on:
  push:
    branches: [ main ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt into Node.js 24 ahead of GitHub's 2026-06-16 forced migration so the Pages
# actions are validated on Node 24 before the cutover (also silences the Node 20
# deprecation warning).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
