name: Deploy game to GitHub Pages

# Publishes the self-contained playable prototypes in site/ to GitHub Pages.
# Auto-enables Pages on first run (configure-pages enablement) so no manual setting is needed.
on:
  push:
    branches: [ main, claude/zen-albattani-wDzFr ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
